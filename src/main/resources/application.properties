spring.application.name=stark-vms-backend

# Externalized Database Connectivity Settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Schema Management & Validation
# Flyway manages explicit migrations; Hibernate validates schema on startup
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# CORS Configuration for Frontend Integration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Security & JWT Configuration
# JWT_SECRET must be at least 32 characters (256 bits) for HMAC-SHA256
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.security.jwt.issuer=${JWT_ISSUER:stark-vms-backend}
app.security.jwt.audience=${JWT_AUDIENCE:stark-vms-frontend}

# Course User Authentication Configuration (Externalized)
app.security.course-user.email=${COURSE_USER_EMAIL:}
app.security.course-user.password-hash=${COURSE_USER_PASSWORD_HASH:}

# Spring Boot Actuator Health Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=true
